name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI database: trust auth, so no password lives in this file.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The real-ChromaDB test needs the all-MiniLM-L6-v2 embedding model.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # No API keys are configured: every LLM call in the suite is mocked.
      - name: Lint (ruff)
        run: ruff check .

      - name: Test suite with coverage gate (SQLite)
        run: >-
          pytest -q -p no:cacheprovider
          --cov=app --cov-report=term-missing --cov-fail-under=92

      - name: DB tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/postgres
        run: pytest -q -p no:cacheprovider -m db
