<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="rrvdxb-demo" content="chat">
<meta name="color-scheme" content="light dark">
<title>Sara · RRVDXB demo</title>
<style>
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --text: #1d1b18;
  --muted: #6b665e;
  --border: #e3dfd7;
  --accent: #8a5a2b;
  --accent-text: #ffffff;
  --user: #efe6da;
  --error: #a3261c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161513;
    --surface: #211f1c;
    --text: #f1ede6;
    --muted: #a39d93;
    --border: #36322d;
    --accent: #d39a5c;
    --accent-text: #161513;
    --user: #3a3128;
    --error: #ff8a7f;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 16px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 0 10px;
  border-bottom: 1px solid var(--border);
}
header h1 { font-size: 1.1rem; margin: 0; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; }
.toggle {
  flex: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 999px;
  padding: 6px 12px;
  font: inherit;
  font-size: 0.85rem;
  cursor: pointer;
}
.toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
#log {
  flex: 1;
  overflow-y: auto;
  padding: 16px 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.msg.user { align-self: flex-end; background: var(--user); border-color: transparent; }
.msg.bot { align-self: flex-start; }
.msg.error { color: var(--error); }
.msg ul { margin: 8px 0 0; padding-left: 18px; white-space: normal; }
.deal { margin-top: 8px; font-weight: 600; white-space: normal; }
.details {
  margin: 8px 0 0;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
  color: var(--muted);
  font-size: 0.82rem;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 10px;
  white-space: normal;
}
.details dt { font-weight: 600; }
.details dd { margin: 0; }
.app:not(.show-details) .details { display: none; }
.typing { display: inline-flex; gap: 4px; align-items: center; }
.typing span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted);
  animation: blink 1.2s infinite ease-in-out;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: 0.6; } }
.examples {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 0;
}
.examples button {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 999px;
  padding: 6px 12px;
  font: inherit;
  font-size: 0.85rem;
  cursor: pointer;
}
form {
  display: flex;
  gap: 8px;
  padding: 8px 0 calc(12px + env(safe-area-inset-bottom));
}
input[type="text"] {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 12px;
  padding: 10px 12px;
  font: inherit;
}
form button {
  border: 0;
  background: var(--accent);
  color: var(--accent-text);
  border-radius: 12px;
  padding: 10px 16px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
button:disabled, input:disabled { opacity: 0.55; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { color: var(--muted); font-size: 0.8rem; padding-bottom: 4px; }
footer { color: var(--muted); font-size: 0.75rem; padding-bottom: 8px; }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div>
      <h1>Sara, the RRVDXB shopping assistant</h1>
      <p>Demo with a mock catalog, mock FAQs and a mock deal.</p>
    </div>
    <button type="button" class="toggle" id="details-toggle" aria-pressed="false">Show details</button>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <div class="examples" id="examples">
    <button type="button">Can you recommend a perfume?</button>
    <button type="button">What is your return policy?</button>
    <button type="button">Are there any deals right now?</button>
    <button type="button">How do I track my order?</button>
  </div>
  <form id="composer" autocomplete="off">
    <input type="text" id="message" maxlength="2000" placeholder="Ask about products, shipping, returns or deals" aria-label="Your message" required>
    <button type="submit" id="send">Send</button>
  </form>
  <div class="status" id="status">Connecting…</div>
  <footer>Messages are saved under a random demo id and may be deleted at any time. Please don't enter personal information.</footer>
</div>
<script>
"use strict";
(function () {
  var TOKEN_URL = "/api/v1/auth/demo-token";
  var CHAT_URL = "/api/v1/ai/chat";
  var token = null;
  var busy = false;

  var app = document.getElementById("app");
  var log = document.getElementById("log");
  var form = document.getElementById("composer");
  var input = document.getElementById("message");
  var sendButton = document.getElementById("send");
  var statusLine = document.getElementById("status");
  var toggle = document.getElementById("details-toggle");
  var exampleButtons = document.querySelectorAll("#examples button");

  function DemoError(message) { this.message = message; }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }

  function scrollDown() { log.scrollTop = log.scrollHeight; }

  function addMessage(kind, text) {
    var node = el("div", "msg " + kind, text);
    log.appendChild(node);
    scrollDown();
    return node;
  }

  function shown(value) {
    return value === null || value === undefined ? "not returned" : String(value);
  }

  function addReply(data) {
    var node = addMessage("bot", data.reply);
    if (Array.isArray(data.recommended_products) && data.recommended_products.length) {
      var list = el("ul");
      data.recommended_products.forEach(function (p) {
        list.appendChild(el("li", "", p.name + " · " + p.currency + " " + p.price));
      });
      node.appendChild(list);
    }
    if (data.deal) {
      node.appendChild(el("div", "deal", "Deal: " + data.deal));
    }
    var details = el("dl", "details");
    [
      ["intent", data.intent],
      ["confidence", data.confidence],
      ["response_time_ms", data.response_time_ms],
      ["fallback_used", data.fallback_used]
    ].forEach(function (pair) {
      details.appendChild(el("dt", "", pair[0]));
      details.appendChild(el("dd", "", shown(pair[1])));
    });
    node.appendChild(details);
    scrollDown();
  }

  function showTyping() {
    var node = el("div", "msg bot typing");
    node.setAttribute("aria-label", "Sara is typing");
    node.appendChild(el("span"));
    node.appendChild(el("span"));
    node.appendChild(el("span"));
    log.appendChild(node);
    scrollDown();
    return node;
  }

  function setBusy(value) {
    busy = value;
    input.disabled = value;
    sendButton.disabled = value;
    exampleButtons.forEach(function (b) { b.disabled = value; });
  }

  async function fetchToken() {
    token = null;
    var response = await fetch(TOKEN_URL, { method: "POST" });
    if (response.status === 404) {
      throw new DemoError("Demo tokens are disabled on this server.");
    }
    if (response.status === 429) {
      throw new DemoError("Too many requests. Please wait a minute and try again.");
    }
    if (!response.ok) {
      throw new DemoError("Could not start a demo session (HTTP " + response.status + ").");
    }
    var body = await response.json();
    token = body.access_token;
  }

  function postChat(message) {
    return fetch(CHAT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ message: message })
    });
  }

  async function ask(message) {
    if (!token) { await fetchToken(); }
    var response = await postChat(message);
    if (response.status === 401) {
      await fetchToken();
      response = await postChat(message);
    }
    if (response.status === 429) {
      throw new DemoError("Too many requests. Please wait a minute and try again.");
    }
    if (!response.ok) {
      throw new DemoError("Something went wrong (HTTP " + response.status + "). Please try again.");
    }
    return response.json();
  }

  async function send(message) {
    message = message.trim();
    if (!message || busy) { return; }
    setBusy(true);
    addMessage("user", message);
    var typing = showTyping();
    try {
      var data = await ask(message);
      typing.remove();
      addReply(data);
      statusLine.textContent = "Ready";
    } catch (err) {
      typing.remove();
      var text = err instanceof DemoError ? err.message : "Network error. Please check your connection and try again.";
      addMessage("bot error", text);
      statusLine.textContent = text;
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var message = input.value;
    input.value = "";
    send(message);
  });

  exampleButtons.forEach(function (button) {
    button.addEventListener("click", function () { send(button.textContent); });
  });

  toggle.addEventListener("click", function () {
    var on = !app.classList.contains("show-details");
    app.classList.toggle("show-details", on);
    toggle.setAttribute("aria-pressed", on ? "true" : "false");
    toggle.textContent = on ? "Hide details" : "Show details";
  });

  addMessage("bot", "Hi, I'm Sara. Ask me about products, shipping, returns, deals or order tracking.");
  fetchToken().then(function () {
    statusLine.textContent = "Ready";
  }, function (err) {
    statusLine.textContent = err instanceof DemoError ? err.message : "Could not reach the server.";
  });
})();
</script>
</body>
</html>
