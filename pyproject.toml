# Tool configuration only (the app is not packaged).

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", "app/ai/chatbot/rag/chroma_db"]

[tool.ruff.lint]
# Ruff's default rule set, pinned explicitly so a user-level ruff config
# cannot change what CI enforces.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
